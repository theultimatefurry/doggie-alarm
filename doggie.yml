name: Doggie live alarm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check if Doggie is live
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ICLOUD_ADDRESS: ${{ secrets.ICLOUD_ADDRESS }}
        run: python check.py
      - name: Save which stream we alerted for
        run: |
          git config user.name "doggie-bot"
          git config user.email "bot@example.com"
          git add last_alert.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "alerted" && git push)
